<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>면접 질문 유형 탐색 서비스 - 와이어프레임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 와이어프레임 전용 그레이톤 스타일 정의 */
        body {
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .mobile-container {
            max-width: 390px;
            min-height: 100vh;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .wf-box {
            border: 2px dashed #9ca3af;
            background-color: #f9fafb;
            border-radius: 8px;
        }
        .wf-card {
            border: 1px solid #d1d5db;
            background-color: #ffffff;
            border-radius: 8px;
        }
        .wf-input {
            border: 1px solid #9ca3af;
            background-color: #f9fafb;
            border-radius: 6px;
            padding: 8px 12px;
        }
        .wf-btn-dark {
            background-color: #374151;
            color: #ffffff;
            font-weight: bold;
            border-radius: 6px;
        }
        .wf-btn-dark:hover {
            background-color: #1f2937;
        }
        /* 주석 태그 스타일 */
        .wf-badge {
            background-color: #e5e7eb;
            color: #4b5563;
            border: 1px solid #9ca3af;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen">

    <!-- 모바일 뷰 컨테이너 (390px 너비) -->
    <div class="mobile-container w-full">
        
        <!-- 상단 헤더 -->
        <header class="sticky top-0 z-40 bg-white border-b border-gray-300 px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-layer-group text-gray-700 text-lg"></i>
                    <h1 class="font-bold text-sm text-gray-800">면접 질문 유형 탐색</h1>
                </div>
                <span class="wf-badge">Wireframe v1.0</span>
            </div>
        </header>

        <!-- 메인 콘텐츠 영역 (하단 탭바 높이만큼 pb-20 확보) -->
        <main class="flex-1 p-4 pb-20 space-y-5">
            <!-- 섹션: 배너/소개 -->
            <div class="wf-box p-4 relative">
                <span class="absolute top-2 right-2 wf-badge">Main Banner</span>
                <h2 class="text-lg font-bold text-gray-800 mb-1">나만의 AI 면접 질문 생성기</h2>
                <p class="text-xs text-gray-500">직무와 채용 공고(JD)를 입력하면 핵심 면접 질문을 도출합니다.</p>
            </div>

            <!-- 섹션: 입력 폼 -->
            <div class="wf-card p-4 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">직무 분야 (Category)</label>
                    <select id="home-job-category" class="wf-input w-full text-xs text-gray-700">
                        <option value="Frontend">프론트엔드 개발자</option>
                        <option value="Backend">백엔드 개발자</option>
                        <option value="PM">기획자 / PM</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">지원 기업명</label>
                    <input type="text" id="home-company-name" value="네이버" class="wf-input w-full text-xs text-gray-700">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">채용공고(JD) 입력</label>
                    <textarea class="wf-input w-full text-xs text-gray-700 h-20 resize-none" placeholder="채용 공고 내용을 붙여넣으세요..."></textarea>
                </div>

                <button type="button" class="wf-btn-dark w-full py-3 text-xs">
                    AI 면접 질문 생성하기
                </button>
            </div>

            <!-- 섹션: 최근 생성 목록 예시 -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-gray-700">최근 탐색 질문</h3>
                    <span class="text-[10px] text-gray-400">더보기 &gt;</span>
                </div>
                <div class="wf-card p-3 space-y-1">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold text-gray-800">React Virtual DOM의 작동 원리</span>
                        <span class="wf-badge">프론트엔드</span>
                    </div>
                    <p class="text-[11px] text-gray-500 line-clamp-1">네이버 · 기술면접 빈출 질문</p>
                </div>
            </div>
        </main>

        <!-- 하단 고정 탭 네비게이션 (Fixed Bottom Navigation) -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-300 z-50">
            <div class="grid grid-cols-4 h-16">
                <!-- 탭 1: 홈 (활성화) -->
                <button class="flex flex-col items-center justify-center text-gray-800 font-bold border-t-2 border-gray-800 -mt-[1px]">
                    <i class="fa-solid fa-house text-base mb-1"></i>
                    <span class="text-[10px]">홈</span>
                </button>
                
                <!-- 탭 2: 질문 탐색 -->
                <button class="flex flex-col items-center justify-center text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-magnifying-glass text-base mb-1"></i>
                    <span class="text-[10px]">질문 탐색</span>
                </button>
                
                <!-- 탭 3: 모의면접 -->
                <button class="flex flex-col items-center justify-center text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-comments text-base mb-1"></i>
                    <span class="text-[10px]">모의면접</span>
                </button>
                
                <!-- 탭 4: 마이페이지 -->
                <button class="flex flex-col items-center justify-center text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-user text-base mb-1"></i>
                    <span class="text-[10px]">마이페이지</span>
                </button>
            </div>
        </nav>

    </div>

</body>
</html>
